<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown to 24 May</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
      background-size: 300% 300%;
      animation: gradientShift 15s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 0.4rem;
    }
    h2 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .countdown {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .unit {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 1.5rem 1rem;
      min-width: 110px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .value {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .label {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .done {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Countdown to</h1>
    <h2 id="target-title">Zürich trip🇨🇭🍫</h2>
    <div id="countdown" class="countdown">
      <div class="unit"><div class="value" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="value" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="value" id="seconds">--</div><div class="label">Seconds</div></div>
    </div>
    <footer id="footer"></footer>
  </main>

  <script>
    (function () {
      function nextTarget() {
        const now = new Date();
        let year = now.getFullYear();
        let target = new Date(year, 4, 24, 0, 0, 0, 0); // month 4 = May
        if (now >= target) {
          target = new Date(year + 1, 4, 24, 0, 0, 0, 0);
        }
        return target;
      }

      const target = nextTarget();
      document.getElementById('footer').textContent =
        'Target: ' + target.toDateString();

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const countdownEl = document.getElementById('countdown');

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
          countdownEl.innerHTML = '<div class="done">Z\u00fcrich time! \u{1F1E8}\u{1F1ED}\u{1F36B}</div>';
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        daysEl.textContent = days;
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
